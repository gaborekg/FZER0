<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#121a1c" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="FZero" />
  <title>Patients · FZero</title>
  <link rel="stylesheet" href="styled.css" />
</head>
<body>
  <span class="blob" aria-hidden="true"></span>
  <div class="app">
    <header class="patients-top">
      <span></span>
      <span class="wordmark">fzero</span>
      <div class="tabs lang-switch" role="group" aria-label="Language / Sprache">
        <button type="button" class="tab" data-lang="en" lang="en">English</button>
        <button type="button" class="tab" data-lang="de" lang="de">Deutsch</button>
      </div>
    </header>
    <h1 class="page-title" data-i18n="patients.title">Patients</h1>

    <ul class="patient-grid" data-el="patient-list"></ul>
    <div class="empty" data-el="empty" hidden>
      <strong data-i18n="patients.empty">No patients yet</strong>
      <span data-i18n="patients.emptyHint">Add your first patient to start.</span>
    </div>
    <div class="page-actions">
      <button type="button" class="cream" data-action="add-patient" data-i18n="patients.add">Add patient</button>
    </div>
    <p class="footnote"><span data-i18n="patients.footnote">Data stays on this device. Nothing is sent to FZero.</span> <a href="legal.html" data-i18n="legal.title">Legal</a></p>
  </div>

  <dialog class="sheet" data-el="add-sheet" aria-labelledby="add-title">
    <span class="sheet-grip" aria-hidden="true"></span>
    <h2 class="sheet-title" id="add-title" data-i18n="add.title">New patient</h2>
    <label class="field"><span data-i18n="add.first">First name</span><input data-field="firstName" maxlength="40" autocomplete="off" /></label>
    <label class="field"><span data-i18n="add.last">Last name</span><input data-field="lastName" maxlength="40" autocomplete="off" /></label>
    <label class="check-field"><input type="checkbox" data-field="consent" /><span><span data-i18n="add.consent">Signed consent for voice recordings is on file</span><small class="muted" data-i18n="add.consentHint"></small></span></label>
    <div class="sheet-actions">
      <button type="button" class="ghost" data-action="cancel-add" data-i18n="common.cancel">Cancel</button>
      <button type="button" class="cream" data-action="save-patient" disabled data-i18n="add.cta">Add patient's info</button>
    </div>
  </dialog>

  <script type="module" src="patients.js"></script>
</body>
</html>
