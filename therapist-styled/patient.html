<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#121a1c" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Patient · FZero</title>
  <link rel="stylesheet" href="styled.css" />
</head>
<body>
  <span class="blob" aria-hidden="true"></span>
  <div class="app">
    <header class="topbar">
      <a class="back" href="./" data-el="back">‹ Patients</a>
      <span class="topbar-title" data-el="title"></span>
      <nav class="tabs" aria-label="Patient">
        <button type="button" class="tab" data-tab="measure">Measure</button>
        <button type="button" class="tab" data-tab="history">History</button>
        <button type="button" class="tab" data-tab="profile">Profile</button>
      </nav>
    </header>
    <main style="flex: 1; display: flex; flex-direction: column">
      <section data-screen="measure" style="flex: 1; display: flex; flex-direction: column"></section>
      <section data-screen="history" hidden></section>
      <section data-screen="profile" hidden></section>
    </main>
  </div>
  <script type="module" src="patient.js"></script>
</body>
</html>
