<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#121a1c" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Praxis · FZero</title>
  <link rel="stylesheet" href="styled.css" />
</head>
<body>
  <span class="blob" aria-hidden="true"></span>
  <div class="app">
    <header class="topbar">
      <a class="back" href="./" data-i18n="nav.patients">‹ Patienten</a>
      <span class="topbar-title"></span>
      <span></span>
    </header>
    <h1 class="page-title" data-i18n="pr.title">Praxis</h1>

    <div class="profile-layout">
      <div class="profile-col">
        <h2 class="section-title" data-i18n="pr.safety">Sicherheits-Checkliste</h2>
        <p class="row-note" data-i18n="pr.safetyHint"></p>
        <ul class="card checklist">
          <li data-el="passcode">
            <span class="check" aria-hidden="true"></span>
            <span class="grow"><span data-i18n="pr.passcode"></span><small class="muted block" data-i18n="pr.passcodeHint"></small></span>
            <button type="button" class="ghost" data-action="confirm-passcode" data-i18n="pr.confirm"></button>
          </li>
          <li data-el="homescreen">
            <span class="check" aria-hidden="true"></span>
            <span class="grow"><span data-i18n="pr.homescreen"></span><small class="muted block" data-el="homescreen-hint"></small></span>
          </li>
          <li data-el="signed">
            <span class="check" aria-hidden="true"></span>
            <span class="grow"><span data-i18n="pr.signed"></span><small class="muted block" data-i18n="pr.signedHint"></small></span>
            <button type="button" class="ghost" data-action="confirm-signed" data-i18n="pr.confirm"></button>
          </li>
          <li class="done">
            <span class="check" aria-hidden="true">✓</span>
            <span class="grow"><span data-i18n="pr.local"></span><small class="muted block" data-i18n="pr.localHint"></small></span>
          </li>
        </ul>
      </div>

      <div class="profile-col">
        <h2 class="section-title" data-i18n="pr.language">Sprache</h2>
        <div class="tabs lang-switch" role="group" data-i18n-aria="pr.language">
          <button type="button" class="tab" data-lang="de">Deutsch</button>
          <button type="button" class="tab" data-lang="en">English</button>
        </div>

        <h2 class="section-title" data-i18n="pr.documents">Dokumente</h2>
        <div class="card rows">
          <a class="row doc-link" href="legal.html?doc=consent"><span data-i18n="pr.docConsent"></span><span class="muted" aria-hidden="true">›</span></a>
          <a class="row doc-link" href="legal.html?doc=info"><span data-i18n="pr.docInfo"></span><span class="muted" aria-hidden="true">›</span></a>
          <a class="row doc-link" href="legal.html?doc=privacy"><span data-i18n="pr.docPrivacy"></span><span class="muted" aria-hidden="true">›</span></a>
          <a class="row doc-link" href="legal.html?doc=imprint"><span data-i18n="pr.docImprint"></span><span class="muted" aria-hidden="true">›</span></a>
        </div>
        <p class="row-note warn" data-i18n="pr.draft"></p>
      </div>
    </div>
  </div>
  <script type="module" src="practice-page.js"></script>
</body>
</html>
